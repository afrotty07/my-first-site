<!DOCTYPE html><html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>池田先生のポートフォリオ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>池田先生のポートフォリオ</h1>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <div class="profile-card">
                    <div class="profile-header">
                        <h2>自己紹介</h2>
                    </div>
                    <div class="profile-info">
                        <div class="info-item">
                            <span class="label">名前</span>
                            <span class="value">池田 太郎</span>
                        </div>
                        <div class="info-item">
                            <span class="label">担当教科</span>
                            <span class="value">数学 / 情報</span>
                        </div>
                        <div class="info-item">
                            <span class="label">趣味</span>
                            <span class="value">プログラミング、写真、キャンプ</span>
                        </div>
                        <div class="info-item">
                            <span class="label">メッセージ</span>
                            <span class="value">新しい技術を使って、教育の可能性を広げることに挑戦しています。</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 池田先生</p>
        </div>
    </footer>
</body></html>
